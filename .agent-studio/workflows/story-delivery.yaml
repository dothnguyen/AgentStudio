version: 1
description: TeamLead refines the story, Developer implements it and runs the tests, QA reviews, TeamLead signs off; failures go back to the Developer.
maxSteps: 20
stages:
  - id: review
    role: TeamLead
    permission: workspace_write
    maxVisits: 1
    promptFile: workflows/prompts/story-review.md
    next: { pass: develop, fail: $fail }
  - id: develop
    role: Developer
    permission: workspace_write
    maxVisits: 4
    promptFile: workflows/prompts/develop.md
    next: { done: qa }
  - id: qa
    role: QA
    permission: read_only
    maxVisits: 4
    promptFile: workflows/prompts/qa.md
    next: { pass: final, fail: develop }
  - id: final
    role: TeamLead
    permission: workspace_write
    maxVisits: 3
    promptFile: workflows/prompts/final-review.md
    next: { pass: $succeed, fail: develop }
