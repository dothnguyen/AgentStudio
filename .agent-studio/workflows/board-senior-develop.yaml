version: 1
description: Resolve escalated tickets in an isolated worktree, have the coordinator run the tests (delegated test-all), and return them to QA only when they pass on the final code.
maxSteps: 4
stages:
  - id: develop
    role: SeniorDeveloper
    permission: workspace_write
    maxVisits: 1
    passRequiresCommands: [test-all]   # a pass counts only if test-all passed in this run on exactly this code
    promptFile: workflows/prompts/board-develop.md
    next: { pass: $succeed, fail: $fail }
