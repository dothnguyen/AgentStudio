version: 2
description: Resolve escalated tickets in an isolated worktree; the coordinator runs the check set for the change and sends a failure back to the developer up to three times.
maxSteps: 10
startsAt: need-escalate
whileRunning: escalating
role: SeniorDeveloper
workspace: worktree
syncBase: true
priority: 0
end:
  pass: qa-ready
  fail: need-escalate
limits:
  maxRuns: 3
steps:
  - id: implement
    agent:
      prompt: board-develop.md
      access: write
  - id: tests
    check:
      checks: code
    onFail:
      retry: implement
      max: 3
      then: end-fail
