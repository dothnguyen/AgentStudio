version: 1
description: Board stage unpack-ready. The ProductOwner turns a feature ticket into stories added to the board (via the board MCP tools).
maxSteps: 4
stages:
  - id: unpack
    role: ProductOwner
    permission: read_only
    maxVisits: 1
    promptFile: workflows/prompts/board-unpack.md
    next: { pass: $succeed, fail: $fail }
