version: 2
description: Board stage dev-ready. The Developer implements the ticket in its worktree; the coordinator then runs the check set for the change and sends a failure back to the Developer up to three times.
maxSteps: 10
startsAt: dev-ready
whileRunning: deving
role: Developer
workspace: worktree
syncBase: true
waitForDependencies: true
end:
  pass: qa-ready
  fail: dev-ready
limits:
  maxRuns: 6
steps:
  - id: implement
    agent:
      prompt: board-develop.md
      access: write
  - id: tests
    check:
      checks: code
    onFail:
      retry: implement
      max: 3
      then: end-fail
