version: 2
description: Board stage qa-ready. QA adds tests for the ticket's acceptance criteria, the coordinator runs the check set for the change, and QA gives the verdict only after seeing that result.
maxSteps: 4
startsAt: qa-ready
whileRunning: qa-ing
role: QA
workspace: worktree
end:
  pass: review-ready
  fail: dev-ready
limits:
  failuresInARow:
    count: 3
    status: need-escalate
  onFailPriority: 0
steps:
  - id: qa_tests
    agent:
      prompt: board-qa-tests.md
      access: write
  - id: tests
    check:
      checks: code
    onFail: qa
  - id: qa
    agent:
      prompt: board-qa.md
      access: read
    passRequires: [tests]
