version: 1
description: Board stage qa-ready. QA adds tests for the ticket's acceptance criteria and has the coordinator run the test suite that fits the change (delegated); QA gives the verdict, which passes only when that suite passed on the final code.
maxSteps: 4
stages:
  - id: qa_tests
    role: QA
    permission: workspace_write
    maxVisits: 1
    promptFile: workflows/prompts/board-qa-tests.md
    next: { done: qa }
  - id: qa
    role: QA
    permission: read_only
    maxVisits: 1
    passRequiresCommands: [test-all, test-backend, test-ui]   # the suite the changed files need must pass in this run, on exactly this code
    promptFile: workflows/prompts/board-qa.md
    next: { pass: $succeed, fail: $fail }
