version: 1
description: Board stage review-ready. The Reviewer reviews the code of the ticket branch (code only; tests are not run).
maxSteps: 4
stages:
  - id: review
    role: Reviewer
    permission: read_only
    maxVisits: 1
    promptFile: workflows/prompts/board-review.md
    next: { pass: $succeed, fail: $fail }
